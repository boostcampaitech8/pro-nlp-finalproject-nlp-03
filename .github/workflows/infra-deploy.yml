name: Airflow CI / Deploy to GCP

# 데이터 파이프라인(Airflow) CI/CD
# - build : DAG 문법 검사 + 변경 경로 감지 (push·PR마다 실행)
# - deploy: DAG만 바뀌면 파일만 갱신(스케줄러가 주기적으로 다시 읽음), 인프라가 바뀌면 이미지 재빌드
#
# fork에서는 배포를 기본 비활성화합니다.
# 배포 단계는 저장소 변수 GCP_DEPLOY_ENABLED=true 이고 GCP_* secrets가 있을 때만 실행됩니다.

on:
  push:
    branches:
      - main
    paths:
      - "airflow/**"
      - ".github/workflows/infra-deploy.yml"
  pull_request:
    paths:
      - "airflow/**"

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      dags_changed: ${{ steps.changes.outputs.dags }}
      infra_changed: ${{ steps.changes.outputs.infra }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Syntax check (DAGs)
        run: |
          python -m compileall -q airflow/dags

      - name: Detect changed files
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            dags:
              - 'airflow/dags/**'
            infra:
              - 'airflow/Dockerfile'
              - 'airflow/docker-compose.yml'

  deploy:
    needs: build
    if: github.event_name == 'push' && vars.GCP_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy DAG-only changes
        if: needs.build.outputs.dags_changed == 'true' && needs.build.outputs.infra_changed == 'false'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            cd ~/pro-nlp-finalproject-nlp-03
            git pull origin main

      - name: Deploy infra changes
        if: needs.build.outputs.infra_changed == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            cd ~/pro-nlp-finalproject-nlp-03
            git pull origin main
            cd airflow
            sudo docker compose build
            sudo docker compose up -d
